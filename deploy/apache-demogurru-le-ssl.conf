# Vhost :443 (SSL) — gurruchagaweb.com canonical + demogurru.unlimited-systems.net + www
# Generado inicialmente por certbot, ahora versionado para sobrevivir re-deploys.
# Si rota el cert, certbot --expand puede volver a tocar este archivo; tras renovar
# correr `pwsh deploy/deploy.ps1 -Step apache` para restaurarlo.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName demogurru.unlimited-systems.net
    ServerAlias gurruchagaweb.com www.gurruchagaweb.com

    DocumentRoot /var/www/demogurru/web

    RewriteEngine On

    # ACME HTTP-01 (certbot) — por consistencia con :80, aunque el reto se sirve por HTTP
    Alias /.well-known/acme-challenge/ /var/www/demogurru/acme/.well-known/acme-challenge/
    <Directory /var/www/demogurru/acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    # Canonical: cualquier host distinto a gurruchagaweb.com → 301 a https://gurruchagaweb.com
    # Aquí cubre HTTPS directos a demogurru.unlimited-systems.net y www.gurruchagaweb.com
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteCond %{HTTP_HOST} !^gurruchagaweb\.com$ [NC]
    RewriteRule ^ https://gurruchagaweb.com%{REQUEST_URI} [END,NE,R=permanent]

    <Directory /var/www/demogurru/web>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # SPA fallback — todo lo que no es archivo real va a index.html
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} !^/\.well-known/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Cache largo para assets con hash, sin cache para index.html
    <FilesMatch "\.(js|css|png|jpg|jpeg|webp|svg|woff2?|ttf|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^index\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    # Proxy al backend Node
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass /api/ http://127.0.0.1:3100/api/
    ProxyPassReverse /api/ http://127.0.0.1:3100/api/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    # Bloquear paths típicos de scanners
    <LocationMatch "^/(\.env|\.git|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/demogurru-error.log
    CustomLog ${APACHE_LOG_DIR}/demogurru-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/demogurru.unlimited-systems.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/demogurru.unlimited-systems.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
